[package]
name = "bevy_pg_editor_tools"
version = "1.18.0"
authors = ["Patrick Chodowski <chodowski.patrick@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Common editor tools"
resolver = "2"

[dependencies]
bevy = { version = "0.18", default-features = true, features = [
    "serialize",
    "mesh_picking",
    "experimental_bevy_feathers"
]}
bevy_pg_core = {version="1.18.0", git="https://www.github.com/PatrickChodowski/bevy_pg_core"}
bevy_pg_nav = {version="1.18.0", git="https://www.github.com/PatrickChodowski/bevy_pg_nav"}
# bevy_pg_nav = {path="../bevy_pg_nav"}
# bevy_pg_scenes = {version="1.18.0", git="https://www.github.com/PatrickChodowski/bevy_pg_scenes"}
bevy_pg_scenes = {path="../bevy_pg_scenes"}
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
libm = "0.2"
serde = "1.0"
serde_json = "1.0"
noise = "0.9.0"
bevy_enhanced_input = "0.22.2"
dyn-clone = "1.0.20"
bevy_seedling = "0.7.0"
bevy_simple_text_input = "0.14.1"
rand = "0.9"

[profile.dev]
opt-level = 1
